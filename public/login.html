<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MedScribe AI — Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand" style="justify-content:center; padding-bottom:6px;">
        <div class="brand-logo">M</div>
        <div>MedScribe AI</div>
      </div>
      <p class="text-muted" style="text-align:center; margin-top:0; font-size:13px;">AI Medical Scribe — sign in to continue</p>

      <div class="role-toggle">
        <button class="role-btn active" id="roleDoctor" onclick="setRole('doctor')">👨‍⚕️ Doctor</button>
        <button class="role-btn" id="rolePatient" onclick="setRole('patient')">🧑 Patient</button>
      </div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
        <div class="error-text" id="errorText"></div>
      </form>

      <div class="demo-hint" id="demoHint">
        Demo doctor account: <b>eleanor.vance@medscribe.ai</b> / <b>doctor123</b>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let role = "doctor";
    function setRole(r) {
      role = r;
      document.getElementById("roleDoctor").classList.toggle("active", r === "doctor");
      document.getElementById("rolePatient").classList.toggle("active", r === "patient");
      document.getElementById("demoHint").innerHTML = r === "doctor"
        ? "Demo doctor account: <b>eleanor.vance@medscribe.ai</b> / <b>doctor123</b>"
        : "Demo patient account: <b>sarah.thompson@example.com</b> / <b>patient123</b>";
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const errorText = document.getElementById("errorText");
      errorText.textContent = "";
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const data = await Api.post("/auth/login", { role, email, password });
        Session.save(data.token, data.role, data.user);
        window.location.href = role === "doctor" ? "/doctor/dashboard.html" : "/patient/home.html";
      } catch (err) {
        errorText.textContent = err.message || "Login failed";
        btn.disabled = false;
        btn.innerHTML = "Sign In";
      }
      return false;
    }
  </script>
</body>
</html>
